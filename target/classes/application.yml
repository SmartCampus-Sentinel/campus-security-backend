server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 确保是 campus_security 且包含 allowPublicKeyRetrieval=true
    url: jdbc:mysql://localhost:3306/campus_security?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.smartcampus.entity # 确保包名是 com.smartcampus
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.smartcampus: DEBUG

# ─────────────── AI 大模型研判配置 ───────────────
ai:
  llm:
    endpoint: https://api.openai.com/v1/chat/completions
    api-key: ${AI_API_KEY:}
    model: gpt-4o
    timeout-seconds: 60

# ─────────────── JWT 配置 ───────────────
jwt:
  secret: ${JWT_SECRET:campus-security-jwt-secret-key-must-be-at-least-256-bits}
  expiration: 86400000  # 24小时(毫秒)

# ─────────────── MQTT 配置 ───────────────
mqtt:
  broker-url: tcp://localhost:1883
  client-id: campus-security-server
  username: mqtt_admin
  password: mqtt_123456
  topics: campus/sensor/#,campus/camera/#

# ─────────────── FFmpeg 配置 ───────────────
ffmpeg:
  path: ffmpeg
  output-dir: ./frames