spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:campus_security_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  redis:
    host: localhost
    port: 6379

mqtt:
  broker-url: tcp://localhost:1883
  client-id: test-client
  username: test
  password: test
  topics: test/#

ai:
  llm:
    endpoint: http://localhost:9999
    api-key: test-key
    model: gpt-4o
    timeout-seconds: 5

jwt:
  secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000

logging:
  level:
    root: WARN
    com.smartcampus: DEBUG
